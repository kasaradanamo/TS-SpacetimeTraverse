plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev'
}

rootProject.ext.loadModProperties(project, 'TS_SpacetimeTraverse')

rootProject.ext.configureNeoForgeRuns(project, [
        (mod_id)         : [project(':TS_SpacetimeTraverse:common').sourceSets.main],
        'tokorotenslime' : [project(':TokorotenSlime:tokorotenslime-neoforge').sourceSets.main,
                            project(':TokorotenSlime:common').sourceSets.main],
        'ts_multitools'  : [project(':TS_MultiTools:ts_multitools-neoforge').sourceSets.main,
                            project(':TS_MultiTools:common').sourceSets.main]
])

dependencies {
    implementation(project(':TS_SpacetimeTraverse:common')) { transitive = false }

    compileOnly(project(':TokorotenSlime:tokorotenslime-neoforge')) { transitive = false }
    compileOnly(project(':TokorotenSlime:common')) { transitive = false }
}

rootProject.ext.configureNeoForgeModule(project, ':TS_SpacetimeTraverse:common')
